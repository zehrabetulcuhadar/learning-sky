<style>
.tw{transform-box:fill-box;transform-origin:center;animation:tw 4s ease-in-out infinite}
.st{transform-box:fill-box;transform-origin:center;animation:st 3.4s ease-in-out infinite}
.new{transform-box:fill-box;transform-origin:center;animation:nw 2.2s ease-in-out infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:rg 2.2s ease-out infinite}
.pl{animation:fl 7s ease-in-out infinite}
.ss{animation:shoot 10s linear infinite;opacity:0}
.lbl{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c7d2fe;text-anchor:middle}
