@keyframes st{0%,100%{opacity:.55;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(45deg)}}
@keyframes nw{0%,100%{opacity:.8;transform:scale(1) rotate(0)}50%{opacity:1;transform:scale(1.35) rotate(45deg)}}
@keyframes rg{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes shoot{0%{transform:translateX(0);opacity:0}1%{opacity:1}8%{transform:translateX(440px);opacity:0}100%{transform:translateX(440px);opacity:0}}
@media (prefers-reduced-motion:reduce){.tw,.st,.new,.ring,.pl,.ss{animation:none}.ring,.ss{opacity:0}}
</style>
