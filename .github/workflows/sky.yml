name: Update learning sky

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - "planets.json"
      - "build_sky.py"
  schedule:
    - cron: "10 21 * * *" # every night 00:10 Istanbul: future-dated posts appear on their day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sky, posts table and sky.json
        run: python build_sky.py
      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update learning sky"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # The personal site rebuilds when the sky changes. Needs the SITE_DISPATCH_TOKEN secret
      # (fine-grained token, only the site repo, Contents: read and write). Skipped if it is not set.
      - name: Tell the personal site to rebuild
        if: steps.commit.outputs.changed == 'true' && env.SITE_DISPATCH_TOKEN != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/zehrabetulcuhadar/zehrabetulcuhadar.github.io/dispatches \
            -d '{"event_type":"learning-sky-updated"}'
